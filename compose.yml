# Bloks on a server of your own.
#
#   cp .env.example .env      # then fill it in
#   docker compose up -d
#   docker compose exec bloks bloks-server pair
#
# Every setting is in .env, and nothing here needs changing. docs/DOCKER.md
# takes you from nothing to a paired desktop and phone, with snippets for
# Caddy, NGINX, Cloudflare Tunnel and Tailscale. COMPOSE_PROFILES=desktop
# in .env adds a Linux desktop for agents to work (the desktop service).

name: bloks

services:
  bloks:
    image: ghcr.io/hamedgitty/bloks-server:${BLOKS_VERSION:-latest}
    # With no published image to pull (or if you would rather build it):
    # the same image, from the same release, checked against its sha256.
    build:
      context: .
      args:
        BLOKS_VERSION: ${BLOKS_VERSION:-latest}
    restart: unless-stopped
    # what your devices call it unless BLOKS_COMPUTER_NAME says otherwise
    hostname: bloks
    # Everything in .env reaches Bloks as it is written there. A setting
    # left commented out is not set at all, which is not the same as set
    # to nothing for some engines, so leave out what you do not use.
    env_file:
      - path: .env
        required: false
    environment:
      # Off unless .env turns it on: nothing goes to Bloks Cloud or
      # bloks.dev from a server set up this way.
      BLOKS_CLOUD: ${BLOKS_CLOUD:-off}
      # An update here is a newer image (docker compose pull, then
      # docker compose up -d), so About checks and never installs.
      BLOKS_SERVER_UPDATES: "off"
      # The web door, when .env turns it on, listens on every interface in
      # here; the port mapping below keeps it on host loopback.
      BLOKS_WEB_LISTEN: ${BLOKS_WEB_LISTEN:-0.0.0.0:8790}
      # Where the desktop service below answers, when it is turned on.
      # Settings, Computers says how to turn it on when it is not.
      BLOKS_DESKTOP: ${BLOKS_DESKTOP:-desktop}
    ports:
      # Loopback on the host unless .env says otherwise, for a reverse
      # proxy or tunnel on the same machine. BLOKS_BIND=0.0.0.0 publishes
      # it on every interface; your VPN address (a Tailscale 100.x one)
      # publishes it on that network alone.
      - "${BLOKS_BIND:-127.0.0.1}:${BLOKS_HOST_PORT:-8799}:8799"
      # The web door, a browser sign-in through your identity provider,
      # only once .env sets BLOKS_WEB_URL. Keep it behind your proxy.
      - "${BLOKS_BIND:-127.0.0.1}:${BLOKS_WEB_HOST_PORT:-8790}:8790"
    volumes:
      # The workspace, the engines and their sign-ins, all of it. A host
      # folder works too (BLOKS_DATA=./data), owned by uid 1000.
      - ${BLOKS_DATA:-bloks-home}:/home/bloks
    # A model server on this machine but outside compose (Ollama, vLLM,
    # LM Studio) is host.docker.internal from in here.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # long enough for the server to save what it holds as it stops
    stop_grace_period: 30s

  # An agent's own Linux desktop (Settings, Computers, Local VM), run
  # beside Bloks rather than by it: Bloks is never handed the host's Docker
  # socket, so nothing an agent runs can reach the host through it. Off
  # unless .env says COMPOSE_PROFILES=desktop. Nothing of it is published;
  # Bloks reaches it on this project's own network, and its screen opens
  # through Bloks. The same limits the Local VM has on a Mac.
  desktop:
    profiles: ["desktop"]
    image: ghcr.io/hamedgitty/bloks-desktop:${BLOKS_VERSION:-latest}
    build:
      context: docker/desktop
    restart: unless-stopped
    hostname: desktop
    shm_size: 512m
    mem_limit: 4g
    memswap_limit: 4g
    cpus: 2
    pids_limit: 512
    cap_drop: [ALL]
    # the two the desktop's supervisor needs to hand each part its account
    cap_add: [SETUID, SETGID]
    volumes:
      # its files and browser sign-ins, kept when the desktop is recreated
      - bloks-desktop:/home/cua/workspace

volumes:
  bloks-home:
  bloks-desktop:
