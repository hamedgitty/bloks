# Bloks for iOS.
#
# The .xcodeproj generated from this file is committed alongside it, so
# nobody needs xcodegen to build. Regenerate with `xcodegen generate`
# from this directory only when the target layout itself changes.
#
# No package dependencies, deliberately. The rest of this repo ships a
# hand-rolled everything with zero test deps, and SSE over URLSession is
# about forty lines.
name: Bloks

options:
  bundleIdPrefix: dev.bloks
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: KN33T93385
    # Swift 5 language mode. Swift 6 strict concurrency is not a fight
    # worth having on the way to a first submission, and 5 is fully
    # supported rather than deprecated.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULE_VERIFIER: NO
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Bloks:
    type: application
    platform: iOS
    sources:
      - path: Bloks
        # Info.plist is hand-maintained, not generated. An `info:` block
        # here would rewrite it on every `xcodegen generate` and silently
        # drop the ATS and local-network keys the app cannot run without.
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bloks.app
        PRODUCT_NAME: Bloks
        INFOPLIST_FILE: Bloks/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # iPhone only for the first release. iPad is a different layout
        # problem (three columns, not two) and is not what ships first.
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        ENABLE_PREVIEWS: YES
      # CODE_SIGN_IDENTITY is deliberately not set. Automatic signing picks
      # it, and pinning a value here makes Xcode refuse the build outright
      # ("conflicting provisioning settings") rather than use it.

# An explicit scheme, because without one xcodebuild synthesises its own and
# the Archive action lands on Debug. Automatic signing then asks Apple for a
# DEVELOPMENT profile, which needs a registered device, and archiving for the
# App Store fails on a team that has never registered one.
schemes:
  Bloks:
    build:
      targets:
        Bloks: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
