version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # One pull request a week for routine bumps, kept separate from the
    # ones worth reading. Anything with a CVE comes through on its own.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
      production-patches:
        dependency-type: production
        update-types: ["patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
