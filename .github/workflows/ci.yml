name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the old run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # A lockfile that does not match package.json is its own bug, so
      # this fails rather than quietly resolving something different.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - name: Check for stray build output
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The build changed tracked files. Something that should be"
            echo "ignored is committed, or generated output drifted:"
            git status --porcelain
            exit 1
          fi
